# Serviços apenas para desenvolvimento local. Não reutilize estas credenciais em produção.
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=finansmart'
      - 'POSTGRES_PASSWORD=finansmart'
      - 'POSTGRES_USER=finansmart'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.4'
    command: ['start-dev', '--import-realm']
    environment:
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
      # Valores lidos do arquivo .env, que não vai para o Git (modelo em .env.example).
      - 'GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-nao-configurado}'
      - 'GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-nao-configurado}'
    ports:
      - '127.0.0.1:8180:8080'
    volumes:
      - './docker/keycloak/finansmart-realm.json:/opt/keycloak/data/import/finansmart-realm.json:ro'
      - './docker/keycloak/themes/finansmart:/opt/keycloak/themes/finansmart:ro'

volumes:
  postgres-data:
