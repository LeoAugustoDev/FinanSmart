# Banco apenas para desenvolvimento local. Não reutilize estas credenciais em produção.
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=finansmart'
      - 'POSTGRES_PASSWORD=finansmart'
      - 'POSTGRES_USER=finansmart'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
