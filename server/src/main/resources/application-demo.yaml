spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

app:
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:true}
    user-id: ${DEMO_USER_ID:7d9f3c1e-5a2b-4e8f-9c6d-1b2a3c4d5e6f}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
